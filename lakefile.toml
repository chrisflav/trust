name = "trust"
version = "0.1.0"
defaultTargets = ["trust"]
testDriver = "tests"

[[require]]
name = "aftk"
git = "https://github.com/mathlib-initiative/aftk"
rev = "main"

# A trust certificate is only meaningful if the hash it names can be recomputed,
# so the revision this was hashed with is pinned exactly rather than tracked
# loosely — and upstream, rather than the fork the v4.31.0 bump had to come
# from.  A commit rather than a tag only because no tag holds it yet: `v4.32.0`
# is one commit behind the on-demand proof-irrelevant hash, which the hasher we
# do not have yet will want.  `runFor`, the one entry point used today, is the
# same function at both revisions.
[[require]]
name = "semantic_hash"
git = "https://github.com/mathlib-initiative/semantic_hash"
rev = "0496f6d7b650cb03c9ffc61089ffd400dfd98564"

[[lean_lib]]
name = "Trust"

[[lean_exe]]
name = "trust"
root = "Main"
supportInterpreter = true
# The suite is a plain executable rather than a test framework: LSpec would be a
# third dependency to keep building on whichever Lean this repository pins, and
# what these tests need is an assertion and an exit code.
[[lean_exe]]
name = "tests"
root = "Tests.Main"
supportInterpreter = true
